<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 화면 비율에 맞추고 불필요한 확대/축소를 방지 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- 모바일 브라우저 상단 주소창 색상(하늘색 배경과 통일) -->
    <meta name="theme-color" content="#cde9f6" />

    <title>Taiko World — P.Taiko 3D 가상공간</title>
    <meta
      name="description"
      content="지역 타이코 서클 P.Taiko의 3D 가상공간 Taiko World에서 잔디 공원을 산책하고 직접 타이코를 두드려 보세요!"
    />

    <!-- 카카오톡·SNS 링크 공유 시 제목과 설명을 깔끔하게 표시하는 OG(Open Graph) 태그 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Taiko World — P.Taiko 3D 가상공간" />
    <meta
      property="og:description"
      content="잔디 공원을 돌아다니며 직접 타이코(돈/카)를 체험해 볼 수 있는 P.Taiko 3D 웹 공간"
    />

    <!-- 브라우저 탭 아이콘 (파비콘 404 에러 방지) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- React 앱이 그려지는 최상위 컨테이너 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
