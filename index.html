<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 화면 비율에 맞추고 불필요한 확대/축소를 방지 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- 모바일 브라우저 상단 주소창 색상(하늘색 배경과 통일) -->
    <meta name="theme-color" content="#cde9f6" />

    <title>Taiko World — P.Taiko 3Dバーチャル空間</title>
    <meta
      name="description"
      content="地域和太鼓サークルP.Taikoの3Dバーチャル空間Taiko Worldで、芝生広場を歩きながら和太鼓を体験しよう！"
    />

    <!-- SNS 링크 공유 시 제목과 설명을 깔끔하게 표시하는 OG(Open Graph) 태그 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="Taiko World — P.Taiko 3Dバーチャル空間" />
    <meta
      property="og:description"
      content="芝生広場を散歩しながら和太鼓（ドン／カッ）や合奏を楽しめるP.Taiko 3Dウェブ空間"
    />

    <!-- 브라우저 탭 아이콘 (파비콘 404 에러 방지) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- React 앱이 그려지는 최상위 컨테이너 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
